<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Armwrestling Science 3D</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="stage" aria-label="3D scene"></div>
  <header class="badge">
    <p class="name">Armwrestling Science 3D</p>
    <p class="build">Build v0.6 · camera views</p>
  </header>
  <nav class="views" id="views" aria-label="Camera views" hidden></nav>
  <aside class="panel" id="panel" data-open="false" hidden>
    <button class="panel-toggle" id="panel-toggle" type="button" aria-expanded="false" aria-controls="sliders">Pose sliders</button>
    <div class="sliders" id="sliders"></div>
  </aside>
  <p class="note" id="note">Loading…</p>
  <p class="error" id="error" hidden>This device's browser can't show 3D graphics (WebGL is off or unsupported). Try a recent Chrome, Safari or Firefox.</p>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
